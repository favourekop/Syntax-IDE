name: SYNTAX IDE checks

on:
  pull_request:
    branches: [main, "feature/**", "desktop/**"]
  push:
    branches: [main, "feature/**", "desktop/**"]

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install
      - name: Build Next.js desktop interface
        run: npm run build:web
      - name: Validate Electron main and runtime syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/runtime.cjs

  windows-installer:
    if: startsWith(github.head_ref, 'desktop/') || startsWith(github.ref, 'refs/heads/desktop/')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install
      - name: Package Windows installer
        run: npm run build:desktop
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: syntax-ide-windows-installer
          path: release/*.exe
          if-no-files-found: error

  api-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install
      - name: Build API
        run: npm run build
